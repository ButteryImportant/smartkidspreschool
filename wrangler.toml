name = "smartkidspreschool"
main = "worker.js"
compatibility_date = "2026-08-01"

# Modern Cloudflare Static Assets
assets = { directory = "./" }

# Cloudflare D1 Serverless SQL Database Binding
[[d1_databases]]
binding = "DB"
database_name = "smartkids-db"
database_id = "smartkids-db-binding"
migrations_dir = "migrations"

# Cloudflare R2 Object Storage (Documents, PDFs, Images)
[[r2_buckets]]
binding = "BUCKET"
bucket_name = "smartkids-storage"
